description: PT Qerja Manfaat Bangsa (Qerja) is an Indonesian human-resources company operating an
  end-to-end HR product ecosystem for employers, established in 2007 and later part of the PT M Cash
  Integrasi Tbk technology group. In 2019 it acquired Karir.com, Indonesia's first job portal (since
  1998), and reports serving over 50,000 clients and 8 million member users across the country. The
  public presence is a corporate marketing site (qerjagroup.com) covering its HR services, clients,
  and user demographics; no public developer portal, API documentation, or machine-readable API
  surface was found during enrichment.
